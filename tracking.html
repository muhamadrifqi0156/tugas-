<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Pengiriman - SITTA UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">

  <header>
    <nav class="topbar" id="nav" aria-label="Menu utama"></nav>
  </header>

  <main>
    <h2>Tracking Pengiriman</h2>

    <form class="card search" id="formCari" novalidate>
      <div style="flex: 1;">
        <label for="noDO" style="margin-top: 0;">Nomor Delivery Order</label>
        <input id="noDO" placeholder="contoh: 2023001234">
      </div>
      <button class="btn" style="align-self: end;">Cari</button>
    </form>

    <p class="err" id="errCari"></p>

    <section id="hasil" aria-live="polite"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
